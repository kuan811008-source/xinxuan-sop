<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>個人記帳本</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#1e40af;--primary-light:#dbeafe;--primary-hover:#1d4ed8;
  --header-bg:#1e293b;--sidebar-bg:#f8fafc;--border:#e2e8f0;
  --text:#1e293b;--text-sub:#64748b;--text-muted:#94a3b8;
  --overdue-bg:#fef2f2;--overdue-border:#ef4444;--overdue-text:#991b1b;--overdue-badge:#ef4444;
  --warn-bg:#fffbeb;--warn-border:#f59e0b;--warn-text:#92400e;--warn-badge:#f59e0b;
  --done-bg:#f0fdf4;--done-border:#86efac;--done-text:#166534;--done-badge:#22c55e;
  --r:8px;--shadow:0 1px 3px rgba(0,0,0,.1)
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft JhengHei',sans-serif;
  background:#f1f5f9;color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
.loading-overlay{position:fixed;inset:0;background:rgba(248,250,252,.96);z-index:1000;
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}
.spinner{width:36px;height:36px;border:3px solid #e2e8f0;border-top-color:var(--primary);
  border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:.9rem;color:var(--text-sub)}
header{background:var(--header-bg);color:#f1f5f9;padding:0 20px;height:54px;
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:10}
.h-title{font-size:1.05rem;font-weight:700;letter-spacing:.02em}
.h-title em{color:#93c5fd;font-style:normal}
.h-right{display:flex;align-items:center;gap:10px}
.conn-badge{font-size:.72rem;padding:3px 10px;border-radius:20px;font-weight:600;white-space:nowrap}
.conn-ok{background:#dcfce7;color:#166534}
.conn-err{background:#fef2f2;color:#991b1b}
.conn-wait{background:#fef9c3;color:#854d0e}
.h-actions{display:flex;gap:7px;align-items:center}
.h-link{text-decoration:none;color:#cbd5e1;font-size:.82rem;padding:5px 10px;border-radius:6px;transition:all .15s;white-space:nowrap}
.h-link:hover{background:#334155;color:#fff}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;border-radius:6px;
  border:none;cursor:pointer;font-size:.83rem;font-weight:500;transition:all .15s;
  white-space:nowrap;font-family:inherit;line-height:1.4}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-hover)}
.btn-dark{background:#334155;color:#e2e8f0}.btn-dark:hover{background:#475569}
.btn-ghost{background:transparent;color:var(--text-sub);border:1px solid var(--border)}.btn-ghost:hover{background:#f1f5f9}
.btn-danger{background:#ef4444;color:#fff}.btn-danger:hover{background:#dc2626}
.btn-sm{padding:4px 10px;font-size:.78rem}
.btn-xs{padding:2px 8px;font-size:.74rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.wrap{flex:1;overflow-y:auto;padding:20px;min-width:0}
.inner{max-width:960px;margin:0 auto}
/* summary cards */
.sum-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.sum-card{background:#fff;border:1px solid var(--border);border-radius:var(--r);
  padding:16px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.sum-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:#cbd5e1}
.sum-card.in::before{background:var(--done-badge)}
.sum-card.ex::before{background:var(--overdue-badge)}
.sum-card.bal::before{background:var(--primary)}
.sum-card.tot::before{background:#8b5cf6}
.sum-lbl{font-size:.76rem;color:var(--text-muted);margin-bottom:6px;font-weight:500}
.sum-num{font-size:1.5rem;font-weight:700;letter-spacing:-.01em}
.sum-card.in .sum-num{color:var(--done-text)}
.sum-card.ex .sum-num{color:var(--overdue-text)}
.pos{color:var(--done-text)!important}
.neg{color:var(--overdue-text)!important}
/* toolbar */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.tb-field{display:flex;align-items:center;gap:6px}
.tb-field label{font-size:.78rem;color:var(--text-sub);font-weight:500}
.ctrl{padding:7px 10px;border:1px solid #cbd5e1;border-radius:6px;font-size:.84rem;
  font-family:inherit;background:#fff;color:var(--text);cursor:pointer}
.ctrl:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(30,64,175,.1)}
.tb-spacer{flex:1}
/* chart */
.card{background:#fff;border:1px solid var(--border);border-radius:var(--r);
  box-shadow:var(--shadow);padding:16px;margin-bottom:18px}
.card-title{font-size:.9rem;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.legend{display:flex;gap:14px;margin-left:auto;font-size:.74rem;color:var(--text-sub);font-weight:500}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.dot.in{background:var(--done-badge)}
.dot.ex{background:var(--overdue-badge)}
.chart{display:flex;align-items:flex-end;justify-content:space-around;gap:8px;height:180px;padding-top:10px}
.chart-empty{display:flex;align-items:center;justify-content:center;height:180px;color:var(--text-muted);font-size:.85rem}
.cbar-group{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;max-width:90px}
.cbar-pair{display:flex;align-items:flex-end;gap:4px;height:100%;width:100%;justify-content:center}
.cbar{width:26px;border-radius:4px 4px 0 0;transition:height .4s;position:relative;min-height:2px}
.cbar.in{background:var(--done-badge)}
.cbar.ex{background:var(--overdue-badge)}
.cbar-val{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:.62rem;
  color:var(--text-sub);white-space:nowrap;font-weight:600}
.cbar-lbl{font-size:.72rem;color:var(--text-muted);font-weight:600}
/* charts row */
.charts-row{display:grid;grid-template-columns:1.55fr 1fr;gap:14px;margin-bottom:18px}
.charts-row .card{margin-bottom:0}
/* donut / pie */
.pie-wrap{display:flex;align-items:center;gap:16px}
.pie-legend{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.pie-li{display:flex;align-items:center;gap:8px;font-size:.78rem}
.pie-li .dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.pie-li .pl-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-sub)}
.pie-li .pl-amt{font-weight:600;color:var(--text)}
.pie-li .pl-pct{color:var(--text-muted);font-size:.72rem;width:36px;text-align:right}
.pie-empty{display:flex;align-items:center;justify-content:center;height:128px;color:var(--text-muted);font-size:.82rem;width:100%}
/* budget */
.budget{background:#fff;border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:13px 16px;margin-bottom:18px}
.bg-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.bg-title{font-size:.84rem;font-weight:700;display:flex;align-items:center;gap:7px}
.bg-info{font-size:.8rem;color:var(--text-sub)}
.bg-info b{color:var(--text)}
.bg-bar{height:10px;background:#e2e8f0;border-radius:6px;overflow:hidden}
.bg-fill{height:100%;border-radius:6px;transition:width .4s}
.bg-fill.ok{background:var(--done-badge)}
.bg-fill.warn{background:var(--warn-badge)}
.bg-fill.over{background:var(--overdue-badge)}
.bg-over-msg{margin-top:7px;font-size:.8rem;font-weight:600;color:var(--overdue-text)}
.bg-empty{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.bg-empty span{font-size:.82rem;color:var(--text-muted)}
/* search */
.tb-search{position:relative}
.tb-search input{padding:7px 10px 7px 30px;border:1px solid #cbd5e1;border-radius:6px;font-size:.84rem;font-family:inherit;width:170px;background:#fff;color:var(--text)}
.tb-search input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(30,64,175,.1)}
.tb-search::before{content:'🔍';position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:.78rem;opacity:.6;pointer-events:none}
/* annual */
.modal-box.wide{width:560px}
.yr-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:14px}
.yr-nav b{font-size:1.05rem}
.yr-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.yr-tile{text-align:center;padding:10px 6px;border-radius:var(--r);border:1px solid var(--border)}
.yr-tile .t-lbl{font-size:.72rem;color:var(--text-muted)}
.yr-tile .t-num{font-size:1.02rem;font-weight:700;margin-top:3px}
.yr-scroll{max-height:56vh;overflow-y:auto}
.yr-table{width:100%;border-collapse:collapse;font-size:.8rem;margin-bottom:6px}
.yr-table th,.yr-table td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--border)}
.yr-table th{color:var(--text-muted);font-weight:600;font-size:.74rem;position:sticky;top:0;background:#fff}
.yr-table th:first-child,.yr-table td:first-child{text-align:left}
.yr-cats{margin-top:14px}
.yr-cats .yc-title{font-size:.8rem;font-weight:700;margin-bottom:8px}
/* list */
.list-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.list-hd .card-title{margin-bottom:0}
.ent-list{display:flex;flex-direction:column;gap:7px}
.ent-empty{text-align:center;padding:40px 12px;color:var(--text-muted);font-size:.85rem;line-height:1.7}
.ent-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;
  border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);transition:all .15s}
.ent-row:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(0,0,0,.08)}
.ent-mark{width:6px;align-self:stretch;border-radius:4px;flex-shrink:0}
.ent-mark.in{background:var(--done-badge)}
.ent-mark.ex{background:var(--overdue-badge)}
.ent-main{flex:1;min-width:0}
.ent-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ent-cat{font-size:.72rem;padding:2px 9px;border-radius:20px;font-weight:600;background:#e2e8f0;color:var(--text-sub)}
.ent-cat.in{background:var(--done-bg);color:var(--done-text)}
.ent-cat.ex{background:var(--overdue-bg);color:var(--overdue-text)}
.ent-date{font-size:.75rem;color:var(--text-muted)}
.ent-note{font-size:.8rem;color:var(--text-sub);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ent-amt{font-size:1.05rem;font-weight:700;white-space:nowrap;flex-shrink:0}
.ent-amt.in{color:var(--done-text)}
.ent-amt.ex{color:var(--overdue-text)}
.ent-actions{display:flex;gap:5px;flex-shrink:0}
.icon-btn{width:30px;height:30px;border-radius:6px;border:1px solid var(--border);background:#fff;
  cursor:pointer;font-size:.82rem;display:flex;align-items:center;justify-content:center;transition:all .15s}
.icon-btn:hover{background:#f1f5f9}
.icon-btn.del:hover{background:var(--overdue-bg);border-color:var(--overdue-border);color:var(--overdue-text)}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;
  display:none;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal-box{background:#fff;border-radius:12px;padding:24px;width:420px;
  max-width:92vw;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-title{font-size:1rem;font-weight:700;margin-bottom:16px}
.form-group{margin-bottom:13px}
.form-label{display:block;font-size:.83rem;font-weight:500;color:var(--text-sub);margin-bottom:5px}
.form-input{width:100%;padding:8px 11px;border:1px solid #cbd5e1;border-radius:6px;
  font-size:.88rem;font-family:inherit;transition:border-color .15s;background:#fff;color:var(--text)}
.form-input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(30,64,175,.1)}
.input-row{display:flex;gap:8px}
.input-row>*{flex:1}
.type-toggle{display:flex;gap:8px}
.type-opt{flex:1;text-align:center;padding:9px;border:1px solid #cbd5e1;border-radius:6px;
  cursor:pointer;font-size:.86rem;font-weight:600;transition:all .15s;user-select:none;color:var(--text-sub)}
.type-opt.sel-in{background:var(--done-bg);border-color:var(--done-badge);color:var(--done-text)}
.type-opt.sel-ex{background:var(--overdue-bg);border-color:var(--overdue-badge);color:var(--overdue-text)}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);
  background:#1e293b;color:#fff;padding:10px 20px;border-radius:8px;font-size:.85rem;
  z-index:500;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
/* mobile */
@media(max-width:640px){
  header{height:auto;min-height:48px;padding:8px 12px;flex-wrap:wrap;gap:4px}
  .h-title{font-size:.9rem}
  .h-right{gap:5px;flex-wrap:wrap;justify-content:flex-end}
  .conn-badge{display:none}
  .h-actions .btn,.h-link{padding:5px 9px;font-size:.76rem}
  .wrap{padding:12px}
  .sum-row{grid-template-columns:repeat(2,1fr);gap:9px}
  .sum-num{font-size:1.25rem}
  .cbar{width:18px}
  .cbar-pair{gap:3px}
  .toolbar{gap:8px}
  .tb-spacer{display:none}
  .toolbar .btn{flex:1;justify-content:center}
  .charts-row{grid-template-columns:1fr}
  .tb-search{flex:1}
  .tb-search input{width:100%}
  .modal-box.wide{width:95vw}
  .yr-table th,.yr-table td{padding:5px 5px;font-size:.74rem}
  .ent-amt{font-size:.96rem}
  .modal-box{max-width:95vw;padding:18px}
  .toast{bottom:20px;max-width:88vw;white-space:normal;text-align:center}
}
</style>
</head>
<body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text">連線至資料庫中...</div>
</div>

<header>
  <div class="h-title">個人<em>記帳本</em></div>
  <div class="h-right">
    <span class="conn-badge conn-wait" id="connBadge">● 連線中</span>
    <div class="h-actions">
      <button class="btn btn-dark btn-sm" onclick="exportData()">↑ 匯出</button>
      <button class="btn btn-dark btn-sm" onclick="document.getElementById('importInput').click()">↓ 匯入</button>
      <input type="file" id="importInput" accept=".json" style="display:none" onchange="importData(event)">
    </div>
  </div>
</header>

<div class="wrap">
  <div class="inner">
    <div class="sum-row" id="sumRow"></div>

    <div id="budgetBar"></div>

    <div class="toolbar">
      <div class="tb-field">
        <label>月份</label>
        <select class="ctrl" id="monthSel" onchange="onFilterChange()"></select>
      </div>
      <div class="tb-field">
        <label>類型</label>
        <select class="ctrl" id="typeSel" onchange="onFilterChange()">
          <option value="all">全部</option>
          <option value="income">收入</option>
          <option value="expense">支出</option>
        </select>
      </div>
      <div class="tb-field">
        <label>分類</label>
        <select class="ctrl" id="catSel" onchange="onFilterChange()"></select>
      </div>
      <div class="tb-field tb-search">
        <input id="searchInput" type="search" placeholder="搜尋備註 / 分類" oninput="onFilterChange()">
      </div>
      <div class="tb-spacer"></div>
      <button class="btn btn-ghost" onclick="openAnnualModal()">📅 年度總結</button>
      <button class="btn btn-primary" onclick="openEntryModal()">＋ 新增一筆</button>
    </div>

    <div class="charts-row">
      <div class="card">
        <div class="card-title">📊 近 6 個月收支
          <span class="legend"><span><i class="dot in"></i>收入</span><span><i class="dot ex"></i>支出</span></span>
        </div>
        <div id="chart"></div>
      </div>
      <div class="card">
        <div class="card-title" id="pieTitle">🥧 本月支出分類</div>
        <div id="pie"></div>
      </div>
    </div>

    <div class="list-hd">
      <div class="card-title" id="listTitle">明細</div>
    </div>
    <div class="ent-list" id="entList"></div>
  </div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal-box" id="modalBox"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const SUPA_URL='https://ijnjfpxthoewpwyuzela.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlqbmpmcHh0aG9ld3B3eXV6ZWxhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyMTc4MDksImV4cCI6MjA5MTc5MzgwOX0.kiyAtaVDUFlaV1pWzAMGyfdMuh4GScO8o47CtjnRYy8';
const{createClient}=window.supabase;
const db=createClient(SUPA_URL,SUPA_KEY);

const DEFAULT_CATS={
  income:['薪資','獎金','投資','其他收入'],
  expense:['飲食','交通','購物','娛樂','居家','醫療','教育','通訊','其他']
};
let entries=[];
let filterMonth='',filterType='all',filterCat='all',filterSearch='';
let annualYear=null;
const PIE_COLORS=['#3b82f6','#ef4444','#f59e0b','#22c55e','#8b5cf6','#ec4899','#14b8a6','#f97316','#64748b','#eab308','#06b6d4','#a855f7'];
// 每月預算存本機（此裝置私有），不進雲端
const BUDGET_KEY='xinxuan_ledger_budget';
let monthlyBudget=0;
function loadBudget(){const v=parseFloat(localStorage.getItem(BUDGET_KEY));monthlyBudget=isNaN(v)?0:v;}
function saveBudgetVal(v){monthlyBudget=v;try{localStorage.setItem(BUDGET_KEY,String(v));}catch(e){}}

// ── DATA ──────────────────────────────────────────────────
async function loadFromDB(){
  const res=await db.from('ledger_entries').select('*').order('entry_date',{ascending:false});
  entries=(res.data||[]).map(r=>({
    id:r.id,date:r.entry_date,type:r.type,
    category:r.category||'',amount:parseFloat(r.amount)||0,note:r.note||''
  }));
}
function setupRealtime(){
  const reload=()=>loadFromDB().then(render);
  db.channel('ledger-rt')
    .on('postgres_changes',{event:'*',schema:'public',table:'ledger_entries'},reload)
    .subscribe(status=>{
      const b=document.getElementById('connBadge');
      if(status==='SUBSCRIBED'){b.textContent='● 即時同步中';b.className='conn-badge conn-ok';}
      else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'){b.textContent='● 連線中斷';b.className='conn-badge conn-err';}
      else{b.textContent='● 連線中';b.className='conn-badge conn-wait';}
    });
}

// ── HELPERS ───────────────────────────────────────────────
function genId(){return'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&0x3|0x8)).toString(16);});}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function ea(s){return String(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function fmtMoney(n){const neg=n<0;const v=Math.round(Math.abs(n)).toLocaleString('en-US');return(neg?'-':'')+'NT$ '+v;}
function monthOf(dateStr){return(dateStr||'').slice(0,7);}
function todayStr(){const d=new Date(),p=n=>String(n).padStart(2,'0');return`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;}
function curMonth(){return todayStr().slice(0,7);}
function fmtMonthLabel(ym){const[y,m]=ym.split('-');return`${parseInt(m)}月`;}
function fmtDate(dateStr){const[y,m,d]=(dateStr||'').split('-');return`${y}/${m}/${d}`;}
function allCategories(){
  const set=new Set([...DEFAULT_CATS.income,...DEFAULT_CATS.expense]);
  entries.forEach(e=>{if(e.category)set.add(e.category);});
  return[...set];
}
function catsForType(type){
  const set=new Set(DEFAULT_CATS[type]||[]);
  entries.forEach(e=>{if(e.type===type&&e.category)set.add(e.category);});
  return[...set];
}
function catOptions(type){
  return catsForType(type).map(c=>`<option value="${ea(c)}">`).join('');
}

// ── RENDER ────────────────────────────────────────────────
function render(){renderFilters();renderSummary();renderBudget();renderChart();renderPie();renderList();}

function renderFilters(){
  // month options: all months present in data + current month, desc
  const months=new Set(entries.map(e=>monthOf(e.date)).filter(Boolean));
  months.add(curMonth());
  const sorted=[...months].sort().reverse();
  if(!filterMonth||(!months.has(filterMonth)&&filterMonth!=='all'))filterMonth=curMonth();
  const msel=document.getElementById('monthSel');
  msel.innerHTML=`<option value="all">全部月份</option>`+
    sorted.map(m=>`<option value="${m}">${m.replace('-','/')}</option>`).join('');
  msel.value=filterMonth;
  // category options
  const csel=document.getElementById('catSel');
  const cats=allCategories();
  if(filterCat!=='all'&&!cats.includes(filterCat))filterCat='all';
  csel.innerHTML=`<option value="all">全部分類</option>`+
    cats.map(c=>`<option value="${ea(c)}">${esc(c)}</option>`).join('');
  csel.value=filterCat;
  document.getElementById('typeSel').value=filterType;
}

function filtered(){
  const q=filterSearch.trim().toLowerCase();
  return entries.filter(e=>{
    if(filterMonth!=='all'&&monthOf(e.date)!==filterMonth)return false;
    if(filterType!=='all'&&e.type!==filterType)return false;
    if(filterCat!=='all'&&e.category!==filterCat)return false;
    if(q&&!((e.note||'').toLowerCase().includes(q)||(e.category||'').toLowerCase().includes(q)))return false;
    return true;
  });
}

function renderSummary(){
  const monthLabel=filterMonth==='all'?'全部':filterMonth.replace('-','/');
  // month scope = selected month (ignores type/cat filters so cards stay stable)
  const monthEntries=entries.filter(e=>filterMonth==='all'||monthOf(e.date)===filterMonth);
  let mIn=0,mEx=0;
  monthEntries.forEach(e=>{if(e.type==='income')mIn+=e.amount;else mEx+=e.amount;});
  const mBal=mIn-mEx;
  let tIn=0,tEx=0;
  entries.forEach(e=>{if(e.type==='income')tIn+=e.amount;else tEx+=e.amount;});
  const tBal=tIn-tEx;
  document.getElementById('sumRow').innerHTML=`
    <div class="sum-card in"><div class="sum-lbl">${monthLabel} 收入</div><div class="sum-num">${fmtMoney(mIn)}</div></div>
    <div class="sum-card ex"><div class="sum-lbl">${monthLabel} 支出</div><div class="sum-num">${fmtMoney(mEx)}</div></div>
    <div class="sum-card bal"><div class="sum-lbl">${monthLabel} 結餘</div><div class="sum-num ${mBal>=0?'pos':'neg'}">${fmtMoney(mBal)}</div></div>
    <div class="sum-card tot"><div class="sum-lbl">累計總結餘</div><div class="sum-num ${tBal>=0?'pos':'neg'}">${fmtMoney(tBal)}</div></div>`;
}

function renderChart(){
  // last 6 months ending current month
  const now=new Date();
  const months=[];
  for(let i=5;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const ym=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    months.push(ym);
  }
  const data=months.map(ym=>{
    let inc=0,exp=0;
    entries.forEach(e=>{if(monthOf(e.date)===ym){if(e.type==='income')inc+=e.amount;else exp+=e.amount;}});
    return{ym,inc,exp};
  });
  const max=Math.max(1,...data.map(d=>Math.max(d.inc,d.exp)));
  const el=document.getElementById('chart');
  if(data.every(d=>d.inc===0&&d.exp===0)){
    el.className='chart-empty';el.textContent='近 6 個月尚無資料';return;
  }
  el.className='chart';
  const short=n=>n>=10000?(n/10000).toFixed(n>=100000?0:1)+'萬':n>=1000?(n/1000).toFixed(0)+'k':String(Math.round(n));
  el.innerHTML=data.map(d=>{
    const ih=Math.round(d.inc/max*140),eh=Math.round(d.exp/max*140);
    return`<div class="cbar-group">
      <div class="cbar-pair">
        <div class="cbar in" style="height:${d.inc>0?Math.max(ih,2):0}px">${d.inc>0?`<span class="cbar-val">${short(d.inc)}</span>`:''}</div>
        <div class="cbar ex" style="height:${d.exp>0?Math.max(eh,2):0}px">${d.exp>0?`<span class="cbar-val">${short(d.exp)}</span>`:''}</div>
      </div>
      <div class="cbar-lbl">${fmtMonthLabel(d.ym)}</div>
    </div>`;
  }).join('');
}

function renderBudget(){
  const el=document.getElementById('budgetBar');
  if(filterMonth==='all'){el.innerHTML='';return;}
  const spent=entries.filter(e=>e.type==='expense'&&monthOf(e.date)===filterMonth).reduce((a,e)=>a+e.amount,0);
  const label=filterMonth.replace('-','/');
  if(!monthlyBudget||monthlyBudget<=0){
    el.innerHTML=`<div class="budget"><div class="bg-empty">
      <span>💡 設定每月預算，隨時掌握花費進度</span>
      <button class="btn btn-ghost btn-sm" onclick="openBudgetModal()">設定預算</button></div></div>`;
    return;
  }
  const pct=spent/monthlyBudget*100;
  const cls=pct>100?'over':pct>=80?'warn':'ok';
  const remain=monthlyBudget-spent;
  el.innerHTML=`<div class="budget">
    <div class="bg-top">
      <div class="bg-title">🎯 ${label} 預算</div>
      <div class="bg-info">預算 <b>${fmtMoney(monthlyBudget)}</b> · 已花 <b>${fmtMoney(spent)}</b>（${Math.round(pct)}%） · 剩 <b class="${remain>=0?'pos':'neg'}">${fmtMoney(remain)}</b>
        <button class="btn btn-ghost btn-sm" style="margin-left:6px;padding:2px 8px" onclick="openBudgetModal()">⚙</button></div>
    </div>
    <div class="bg-bar"><div class="bg-fill ${cls}" style="width:${Math.min(100,pct)}%"></div></div>
    ${pct>100?`<div class="bg-over-msg">⚠ 本月已超支 ${fmtMoney(spent-monthlyBudget)}</div>`:''}
  </div>`;
}

function renderPie(){
  const el=document.getElementById('pie');
  const scope=filterMonth==='all'?'全部':filterMonth.replace('-','/');
  document.getElementById('pieTitle').textContent=`🥧 ${scope} 支出分類`;
  const map={};
  entries.filter(e=>e.type==='expense'&&(filterMonth==='all'||monthOf(e.date)===filterMonth))
    .forEach(e=>{const k=e.category||'未分類';map[k]=(map[k]||0)+e.amount;});
  const items=Object.entries(map).map(([label,value])=>({label,value})).sort((a,b)=>b.value-a.value);
  const total=items.reduce((a,i)=>a+i.value,0);
  if(!total){el.innerHTML=`<div class="pie-empty">此期間尚無支出</div>`;return;}
  items.forEach((it,i)=>it.color=PIE_COLORS[i%PIE_COLORS.length]);
  const legend=items.map(it=>{
    const pct=Math.round(it.value/total*100);
    return`<div class="pie-li"><span class="dot" style="background:${it.color}"></span>
      <span class="pl-name">${esc(it.label)}</span>
      <span class="pl-amt">${fmtMoney(it.value)}</span>
      <span class="pl-pct">${pct}%</span></div>`;
  }).join('');
  el.innerHTML=`<div class="pie-wrap">${donutSVG(items,total)}<div class="pie-legend">${legend}</div></div>`;
}
function donutSVG(items,total){
  let cum=0;
  const segs=items.map(it=>{
    const pct=it.value/total*100,off=25-cum;cum+=pct;
    return`<circle cx="21" cy="21" r="15.915" fill="none" stroke="${it.color}" stroke-width="7"
      stroke-dasharray="${pct.toFixed(2)} ${(100-pct).toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" pathLength="100"></circle>`;
  }).join('');
  const short=total>=10000?(total/10000).toFixed(1)+'萬':String(Math.round(total));
  return`<svg viewBox="0 0 42 42" width="128" height="128" style="flex-shrink:0">
    <circle cx="21" cy="21" r="15.915" fill="none" stroke="#f1f5f9" stroke-width="7"></circle>
    ${segs}
    <text x="21" y="19.5" text-anchor="middle" font-size="3" fill="#94a3b8">總支出</text>
    <text x="21" y="25" text-anchor="middle" font-size="4.2" font-weight="700" fill="#1e293b">${short}</text>
  </svg>`;
}

function renderList(){
  const list=filtered();
  document.getElementById('listTitle').textContent=`明細（${list.length} 筆）`;
  const el=document.getElementById('entList');
  if(!list.length){el.innerHTML=`<div class="ent-empty">此條件下尚無紀錄<br>點擊右上「＋ 新增一筆」開始記帳</div>`;return;}
  el.innerHTML=list.map(e=>{
    const t=e.type==='income'?'in':'ex';
    const sign=e.type==='income'?'+':'-';
    return`<div class="ent-row">
      <div class="ent-mark ${t}"></div>
      <div class="ent-main">
        <div class="ent-top">
          <span class="ent-cat ${t}">${esc(e.category||'未分類')}</span>
          <span class="ent-date">${fmtDate(e.date)}</span>
        </div>
        ${e.note?`<div class="ent-note">${esc(e.note)}</div>`:''}
      </div>
      <div class="ent-amt ${t}">${sign}${fmtMoney(e.amount).replace('-','')}</div>
      <div class="ent-actions">
        <button class="icon-btn" onclick="openEntryModal('${e.id}')" title="編輯">✏</button>
        <button class="icon-btn del" onclick="confirmDel('${e.id}')" title="刪除">✕</button>
      </div>
    </div>`;
  }).join('');
}

function onFilterChange(){
  filterMonth=document.getElementById('monthSel').value;
  filterType=document.getElementById('typeSel').value;
  filterCat=document.getElementById('catSel').value;
  filterSearch=document.getElementById('searchInput').value;
  renderSummary();renderBudget();renderPie();renderList();
}

// ── MODAL / MUTATIONS ─────────────────────────────────────
let modalType='expense';
function selectType(t){
  modalType=t;
  document.getElementById('optIn').className='type-opt'+(t==='income'?' sel-in':'');
  document.getElementById('optEx').className='type-opt'+(t==='expense'?' sel-ex':'');
  const dl=document.getElementById('catList');if(dl)dl.innerHTML=catOptions(t);
}
function openEntryModal(id){
  const e=id?entries.find(x=>x.id===id):null;
  modalType=e?e.type:'expense';
  const datalist=catOptions(modalType);
  openModal(`
    <div class="modal-title">${e?'編輯紀錄':'新增紀錄'}</div>
    <div class="form-group">
      <div class="type-toggle">
        <div id="optIn" class="type-opt${modalType==='income'?' sel-in':''}" onclick="selectType('income')">＋ 收入</div>
        <div id="optEx" class="type-opt${modalType==='expense'?' sel-ex':''}" onclick="selectType('expense')">－ 支出</div>
      </div>
    </div>
    <div class="input-row">
      <div class="form-group"><label class="form-label">日期</label>
        <input type="date" id="f-date" class="form-input" value="${e?e.date:todayStr()}"></div>
      <div class="form-group"><label class="form-label">金額 (NT$)</label>
        <input type="number" id="f-amount" class="form-input" min="0" step="1" placeholder="0" value="${e?e.amount:''}"></div>
    </div>
    <div class="form-group"><label class="form-label">分類</label>
      <input id="f-category" class="form-input" list="catList" placeholder="選擇或輸入分類" value="${e?ea(e.category):''}">
      <datalist id="catList">${datalist}</datalist></div>
    <div class="form-group"><label class="form-label">備註（選填）</label>
      <input id="f-note" class="form-input" placeholder="例如：午餐、加油、電影票" value="${e?ea(e.note):''}"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" id="saveBtn" onclick="saveEntry('${id||''}')">儲存</button>
    </div>`);
  setTimeout(()=>document.getElementById('f-amount').focus(),50);
}
async function saveEntry(id){
  const date=document.getElementById('f-date').value;
  const amount=parseFloat(document.getElementById('f-amount').value);
  const category=document.getElementById('f-category').value.trim();
  const note=document.getElementById('f-note').value.trim();
  if(!date){alert('請選擇日期');return;}
  if(isNaN(amount)||amount<0){alert('請輸入有效金額');return;}
  const btn=document.getElementById('saveBtn');btn.disabled=true;btn.textContent='處理中...';
  const row={entry_date:date,type:modalType,category,amount,note};
  try{
    if(id){await db.from('ledger_entries').update(row).eq('id',id);}
    else{await db.from('ledger_entries').insert({id:genId(),...row});}
    await loadFromDB();
    // jump filter to the month we just wrote so the user sees it
    filterMonth=monthOf(date);
    render();closeModal();showToast(id?'已更新':'已新增一筆');
  }catch(err){alert('儲存失敗：'+err.message);btn.disabled=false;btn.textContent='儲存';}
}
function confirmDel(id){
  const e=entries.find(x=>x.id===id);if(!e)return;
  openModal(`
    <div class="modal-title">確認刪除</div>
    <p style="font-size:.88rem;color:var(--text-sub);line-height:1.6">
      確定要刪除這筆${e.type==='income'?'收入':'支出'}？<br>
      <b>${esc(e.category||'未分類')} · ${fmtMoney(e.amount)}</b>（${fmtDate(e.date)}）<br>此動作無法復原。</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn btn-danger" id="delBtn" onclick="delEntry('${id}')">確認刪除</button>
    </div>`);
}
async function delEntry(id){
  const btn=document.getElementById('delBtn');btn.disabled=true;btn.textContent='處理中...';
  try{
    await db.from('ledger_entries').delete().eq('id',id);
    await loadFromDB();render();closeModal();showToast('已刪除');
  }catch(err){alert('刪除失敗：'+err.message);btn.disabled=false;btn.textContent='確認刪除';}
}

// ── EXPORT / IMPORT ───────────────────────────────────────
function exportData(){
  const payload={type:'xinxuan_ledger',version:'1.0',exportedAt:new Date().toISOString(),entries};
  const json=JSON.stringify(payload,null,2),blob=new Blob(['﻿'+json],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob);
  const d=new Date(),p=n=>String(n).padStart(2,'0'),a=document.createElement('a');
  a.href=url;a.download=`心選記帳本_備份_${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}.json`;
  a.click();URL.revokeObjectURL(url);
}
async function importData(event){
  const file=event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=async e=>{
    try{
      const imp=JSON.parse(e.target.result);
      const rows=Array.isArray(imp)?imp:imp.entries;
      if(!Array.isArray(rows)){alert('格式不正確');return;}
      if(!confirm(`備份中有 ${rows.length} 筆紀錄，是否匯入？\n（已存在的紀錄 ID 將略過）`))return;
      const existIds=new Set(entries.map(x=>x.id));
      const toInsert=rows.filter(r=>{const id=r.id;return id&&!existIds.has(id);});
      let n=0;
      for(const r of toInsert){
        const type=(r.type==='income'||r.type==='expense')?r.type:'expense';
        const amount=parseFloat(r.amount)||0;
        await db.from('ledger_entries').insert({
          id:r.id,entry_date:r.date||r.entry_date,type,
          category:r.category||'',amount,note:r.note||''
        });
        n++;
      }
      await loadFromDB();render();showToast(`匯入完成，共新增 ${n} 筆`);
    }catch(err){alert('匯入失敗：'+err.message);}
    event.target.value='';
  };
  reader.readAsText(file,'UTF-8');
}

// ── BUDGET ────────────────────────────────────────────────
function openBudgetModal(){
  openModal(`
    <div class="modal-title">設定每月預算</div>
    <div class="form-group"><label class="form-label">每月支出預算 (NT$)</label>
      <input type="number" id="f-budget" class="form-input" min="0" step="100" placeholder="例如：30000" value="${monthlyBudget||''}"></div>
    <p style="font-size:.76rem;color:var(--text-muted);line-height:1.6">預算只存在這台裝置（本機），用來提醒每月花費進度；設為 0 或留空可關閉。</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveBudget()">儲存</button>
    </div>`);
  setTimeout(()=>document.getElementById('f-budget').focus(),50);
}
function saveBudget(){
  const v=parseFloat(document.getElementById('f-budget').value)||0;
  saveBudgetVal(v);renderBudget();closeModal();showToast(v>0?'預算已設定':'已關閉預算');
}

// ── ANNUAL SUMMARY ────────────────────────────────────────
function openAnnualModal(){
  annualYear=parseInt((filterMonth==='all'?curMonth():filterMonth).slice(0,4));
  renderAnnualModal();
}
function changeYear(d){annualYear+=d;renderAnnualModal();}
function renderAnnualModal(){
  const y=annualYear,rows=[],catMap={};let yIn=0,yEx=0;
  for(let m=1;m<=12;m++){
    const ym=`${y}-${String(m).padStart(2,'0')}`;let inc=0,exp=0;
    entries.forEach(e=>{if(monthOf(e.date)===ym){
      if(e.type==='income')inc+=e.amount;
      else{exp+=e.amount;const k=e.category||'未分類';catMap[k]=(catMap[k]||0)+e.amount;}
    }});
    yIn+=inc;yEx+=exp;rows.push({m,inc,exp,bal:inc-exp});
  }
  const yBal=yIn-yEx;
  const monthRows=rows.map(r=>`<tr>
    <td>${r.m} 月</td>
    <td style="color:var(--done-text)">${r.inc?fmtMoney(r.inc):'—'}</td>
    <td style="color:var(--overdue-text)">${r.exp?fmtMoney(r.exp):'—'}</td>
    <td class="${r.bal>=0?'pos':'neg'}">${(r.inc||r.exp)?fmtMoney(r.bal):'—'}</td></tr>`).join('');
  const cats=Object.entries(catMap).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const catBlock=cats.length?`<div class="yr-cats"><div class="yc-title">全年支出分類 Top ${cats.length}</div>
    <table class="yr-table"><tbody>${cats.map(([c,v])=>`<tr><td>${esc(c)}</td><td colspan="3">${fmtMoney(v)}（${Math.round(v/yEx*100)}%）</td></tr>`).join('')}</tbody></table></div>`:'';
  openModal(`
    <div class="yr-nav">
      <button class="btn btn-ghost btn-sm" onclick="changeYear(-1)">◀</button>
      <b>${y} 年度總結</b>
      <button class="btn btn-ghost btn-sm" onclick="changeYear(1)">▶</button>
    </div>
    <div class="yr-tiles">
      <div class="yr-tile"><div class="t-lbl">全年收入</div><div class="t-num pos">${fmtMoney(yIn)}</div></div>
      <div class="yr-tile"><div class="t-lbl">全年支出</div><div class="t-num neg">${fmtMoney(yEx)}</div></div>
      <div class="yr-tile"><div class="t-lbl">全年結餘</div><div class="t-num ${yBal>=0?'pos':'neg'}">${fmtMoney(yBal)}</div></div>
    </div>
    <div class="yr-scroll">
      <table class="yr-table"><thead><tr><th>月份</th><th>收入</th><th>支出</th><th>結餘</th></tr></thead>
        <tbody>${monthRows}</tbody></table>
      ${catBlock}
    </div>
    <div class="modal-actions"><button class="btn btn-primary" onclick="closeModal()">關閉</button></div>`,true);
}

// ── UI PLUMBING ───────────────────────────────────────────
function openModal(html,wide){const box=document.getElementById('modalBox');box.innerHTML=html;box.classList.toggle('wide',!!wide);document.getElementById('modalBg').classList.add('open');}
function closeModal(){document.getElementById('modalBg').classList.remove('open');}
document.getElementById('modalBg').addEventListener('click',function(e){if(e.target===this)closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
let toastTimer;
function showToast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2200);}
function hideLoading(){const el=document.getElementById('loadingOverlay');if(el){el.style.opacity='0';el.style.transition='opacity .4s';setTimeout(()=>el.remove(),400);}}

filterMonth=curMonth();
loadBudget();
(async()=>{
  await loadFromDB();
  hideLoading();
  render();
  setupRealtime();
  setInterval(()=>loadFromDB().then(render),30000);
})();
</script>
